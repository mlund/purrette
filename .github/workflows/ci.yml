name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    steps:
      # Tags and history so `git describe` in build.rs isn't "unknown".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # winit/glow/wgpu need these to build natively on Linux.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libxkbcommon-dev libwayland-dev

      - run: cargo fmt --check
      - run: cargo clippy --tests --no-deps -- -D warnings
      - run: cargo clippy --tests --no-deps --all-features -- -D warnings
      - run: cargo test

      # The web build is what users see, so it gates too; both renderers.
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --all-features
