name: Deploy to GitHub Pages

# Each tag is built once and its `dist` kept as a release asset, so an old version
# serves the exact bytes it was released with. The site is reassembled from those
# assets on every deploy: /purrette/vX.Y.Z/ per release, versions.json, and a root
# redirect to the newest. Run manually to reassemble without a new release.
#
# The github-pages environment only accepts deploys from main, so a tag run builds
# and then dispatches this workflow on main to assemble and deploy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

# Per ref: tag builds never wait on or replace each other, while a queued deploy on
# main is superseded by a newer one, which assembles the same releases anyway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Tags and history so `git describe` in build.rs names the release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match Cargo.toml version
        run: test "v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" = "$GITHUB_REF_NAME"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1

      # Fails if Cargo.lock is stale, so the release is the locked dependency set.
      - name: Check lockfile
        run: cargo fetch --locked

      - name: Build
        run: trunk build --release --public-url "/purrette/$GITHUB_REF_NAME/"

      # Read by the HTML header, which must work without the wasm app.
      - name: Write build-info.json
        run: |
          cgkitten=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "cgkitten") | .version')
          test -n "$cgkitten"
          jq -n --arg web "$GITHUB_REF_NAME" --arg cgkitten "$cgkitten" '{web: $web, cgkitten: $cgkitten}' > dist/build-info.json
          cat dist/build-info.json

      - name: Attach build to release
        run: |
          (cd dist && zip -qr "../site-$GITHUB_REF_NAME.zip" .)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Web build; open at https://mlund.github.io/purrette/$GITHUB_REF_NAME/"
          gh release upload "$GITHUB_REF_NAME" "site-$GITHUB_REF_NAME.zip" --clobber

      - name: Deploy from main
        run: gh workflow run deploy.yml --ref main

  assemble:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Collect release builds
        run: |
          mkdir -p site
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -p "site-$tag.zip" -D zips 2>/dev/null || continue
            unzip -q "zips/site-$tag.zip" -d "site/$tag"
          done
          ls site | grep -q . || { echo "no release builds found"; exit 1; }

      - name: Write versions.json and root redirect
        run: |
          # `~` sorts before everything, so v1.0.0-rc1 lands below v1.0.0.
          versions=$(ls site | grep '^v' | sed 's/-/~/' | sort -rV | sed 's/~/-/')
          latest=$(echo "$versions" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "$versions" | jq -R . | jq -s . > site/versions.json
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$latest/">
          <title>Purrette</title>
          <a href="$latest/">Purrette $latest</a>
          EOF
          cat site/versions.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
