<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Purrette</title>
    <style>
        :root {
            --bg: #1b1b1f;
            --bar: #232323;
            --fg: #d0d0d0;
            --dim: #8a8a8a;
            --link: #6fa8ff;
            --warn: #ffb454;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8f8f8;
                --bar: #ececec;
                --fg: #222;
                --dim: #666;
                --link: #1a5fd0;
                --warn: #a35a00;
            }
        }
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }
        body {
            display: flex;
            flex-direction: column;
            color: var(--fg);
            font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        select { font: inherit; }
        .dim { color: var(--dim); }
        /* Plain HTML, so name, versions and the version menu still work when an
           old build's wasm fails to start. Wraps rather than hiding items on
           narrow screens. */
        #info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.2em 0.9em;
            padding: 4px 10px;
            background: var(--bar);
        }
        #info > * { white-space: nowrap; }
        #info b { font-weight: 600; }
        #nogpu { color: var(--warn); }
        main {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
    </style>
    <!-- Lib and bin share a crate; point trunk at the lib, which holds the wasm entry.
         wasm-opt off: the release profile already shrinks the bundle and wasm-opt adds
         nothing once gzipped, while costing build time and a binaryen install. -->
    <link data-trunk rel="rust" data-target-name="purrette" data-wasm-opt="0" />
</head>
<body>
    <header id="info">
        <b>🐱 Purrette</b>
        <span id="build" class="dim">development build</span>
        <select id="versions" aria-label="Version" hidden></select>
        <a href="https://github.com/mlund/purrette" target="_blank" rel="noopener">GitHub</a>
        <span id="nogpu" hidden>WebGPU is not available in this browser</span>
    </header>
    <main>
        <!-- eframe sizes the drawing buffer from the CSS size and device pixel ratio.
             Setting width/height here or from JavaScript fights it and renders at the wrong scale. -->
        <canvas id="the_canvas_id"></canvas>
        <div id="loading">loading…</div>
    </main>
    <script>
        async function getJson(url) {
            try {
                const r = await fetch(url);
                return r.ok ? await r.json() : null;
            } catch {
                return null;
            }
        }

        // build-info.json is written per release by the deploy; versions.json is
        // shared by all releases, so old builds also list newer ones.
        (async () => {
            if (!navigator.gpu) document.getElementById("nogpu").hidden = false;

            const [info, versions] = await Promise.all([
                getJson("build-info.json"),
                getJson("../versions.json"),
            ]);
            if (info) {
                const cgkitten = document.createElement("a");
                cgkitten.href = `https://github.com/mlund/cgkitten/releases/tag/v${info.cgkitten}`;
                cgkitten.target = "_blank";
                cgkitten.rel = "noopener";
                cgkitten.textContent = `cgkitten ${info.cgkitten}`;
                document.getElementById("build").replaceChildren(`${info.web} · `, cgkitten);
            }

            if (!info || !versions || versions.length === 0) return;
            const select = document.getElementById("versions");
            versions.forEach((v, i) => {
                const label = i === 0 ? `${v} (latest)` : v;
                select.add(new Option(label, v, false, v === info.web));
            });
            select.addEventListener("change", () => {
                const v = select.value;
                if (confirm(`Switch to Purrette ${v}? Current results will be lost.`)) {
                    window.location.href = `../${v}/`;
                } else {
                    select.value = info.web;
                }
            });
            select.hidden = false;
        })();
    </script>
</body>
</html>
