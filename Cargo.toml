[package]
name = "purrette"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Protein charge, capacitance and multipoles vs pH, salt and temperature, in the browser"
repository = "https://github.com/mlund/purrette"

[lib]
crate-type = ["cdylib", "rlib"]

# Distinct from the cdylib name, or the wasm32 outputs collide.
[[bin]]
name = "purrette-desktop"
path = "src/main.rs"

[features]
default = ["plot", "wgpu"]
plot = ["dep:egui_plot"]
# WebGPU/wgpu renderer instead of glow; also exposes the wgpu device for compute.
wgpu = ["eframe/wgpu"]

[dependencies]
# eframe defaults with glow instead of wgpu (the `wgpu` feature adds it back).
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36"
egui_plot = { version = "0.37", optional = true }
egui_logger = "0.12"
log = "0.4"
cgkitten = { version = "0.4.0", default-features = false }
rfd = "0.17"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
# Neighbour queries for the vendored surface mesher.
kdtree = "0.8"
# std::time::Instant panics on wasm32-unknown-unknown.
web-time = "1"

# cgkitten pulls in rand 0.8, whose getrandom needs the JS entropy backend in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Response",
    "Url",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"

# Small wasm without measurable speed loss (measured in cppm-maker: 9.4 → 5.9 MB).
# wasm-opt adds nothing on top once gzipped, so the build skips it.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
